name: Language assurance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Determine governance baseline
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "GOVERNANCE_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          else
            echo "GOVERNANCE_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
          fi
      - run: npm run governance:check
      - run: npm run check
      - run: npm run test:governance
      - run: npm run test:assurance
      - run: npm run test:adversarial
      - run: npm run assurance:complete
